<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Iqbal — Web, Mobile, Automation</title>
  <desc id="desc">Banner profil Iqbal, juga dikenal sebagai BolFengxi, dengan latar biru gelap dan aksen mint.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101d34"/><stop offset="1" stop-color="#080e1c"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#5eead4"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#94a3b8" stroke-opacity=".07"/></pattern>
  </defs>
  <rect width="1200" height="340" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="24" fill="url(#grid)"/>
  <circle cx="1060" cy="168" r="145" fill="#60a5fa" opacity=".04"/>
  <circle cx="1060" cy="168" r="109" fill="none" stroke="#60a5fa" stroke-opacity=".16"/>
